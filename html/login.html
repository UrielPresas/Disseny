<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UPpop</title>
    <link href="../src/output.css" rel="stylesheet">
</head>

<body class="bg-[#C8D3D9] dark:bg-[#232526]">

    <header>
        <nav class="mx-auto flex max-w-7xl items-center px-6 py-4">

            <!-- Logo -->
            <a href="../index.html" class="mr-8 shrink-0" aria-label="UPpop">
                <img src="../img/UPPopLogo.svg" alt="Logo" width="150" height="50">
            </a>

            <!-- Creacio Div navbar -->
            <div class="flex flex-1 items-center justify-between bg-[#F29422] px-4 py-2">

                <!-- Links dins del navbar -->
                <ul class="hidden items-center gap-8 md:flex">
                    <li><a href="#" class="text-[#21201F] hover:text-[#c8d3d9]">Qui som</a></li>
                    <li><a href="#" class="text-[#21201F] hover:text-[#c8d3d9]">Categories</a></li>
                    <li><a href="#" class="text-[#21201F] hover:text-[#c8d3d9]">Contacte</a></li>
                </ul>

                <!-- Botons per cambiar el tema -->
                <!-- Tema clar -->
                <div class="ml-auto flex items-center gap-3">
                    <div class="flex items-center gap-1">
                        <button id="temaClar" type="button" class="p-1 cursor-pointer" aria-label="Tema Clar">
                            <img src="../img/Sol.svg" alt="Tema Clar">
                        </button>

                        <!-- Tema Fosc -->
                        <button id="temaFosc" type="button" class="p-1 cursor-pointer" aria-label="Tema Fosc">
                            <img src="../img/Luna.svg" alt="Luna" width="30" height="30">
                        </button>
                    </div>
                </div>

            </div>
        </nav>
    </header>

    <!-- Secció Main -->
    <main id="login" class="mx-auto flex max-w-7xl flex-col gap-4 px-6 pb-10 md:flex-row">

        <!-- Piano: Esbós fer per IA, no és final!!  -->
        <section aria-hidden="true"
            class="relative min-h-70 overflow-hidden rounded-b-2xl bg-[#E0E0E0] md:w-[36%] md:shrink-0">

            <div class="absolute inset-y-0 left-[18.8%] w-1.5 bg-[#A9A9A9]"></div>
            <div class="absolute bottom-0 left-[54%] top-[70.5%] w-1.5 bg-[#A9A9A9]"></div>
            <div class="absolute bottom-0 left-[89.6%] top-[70.5%] w-1.5 bg-[#A9A9A9]"></div>

            <div class="absolute left-[37.9%] top-0 h-[71%] w-[25.9%] rounded-b-md border-x-[6px] border-b-[6px] border-[#A9A9A9] bg-[#B3B3B3]">
                <div class="mx-auto mt-3 h-[70%] w-[70%] rounded-b-xl bg-black/5"></div>
            </div>

            <div class="absolute left-[75.7%] top-0 h-[71%] w-[25.9%] rounded-b-md border-x-[6px] border-b-[6px] border-[#A9A9A9] bg-[#B3B3B3]">
                <div class="mx-auto mt-3 h-[70%] w-[70%] rounded-b-xl bg-black/5"></div>
            </div>

        </section>

        <!-- Secció Login -->
        <section class="flex flex-1 flex-col items-center rounded-2xl bg-[#F26B5F] dark:bg-[#73332D] px-6 pb-12 pt-10 text-[#21201F] dark:text-[#EBE3DA] md:min-h-130">

            <h1 class="text-center text-3xl font-light">Benvingut a UPpop!</h1>

            <!-- Formulari Login -->
            <form class="mt-14 flex w-full max-w-sm flex-col gap-6">

                <!-- Input Nom -->
                <input type="text" name="nom" placeholder="Nom" required
                    class="h-9 w-full rounded bg-[#F29422] px-3 text-[#21201F] placeholder-[#21201F]">

                <!-- Input Contrasenya -->
                <input type="password" name="password" placeholder="Contrasenya" required
                    class="h-9 w-full rounded bg-[#F29422] px-3 text-[#21201F] placeholder-[#21201F]">

                <!-- Botó -->
                <button type="submit"
                    class="h-9 w-full rounded bg-[#F29422] text-xl font-light text-[#21201F] transition hover:bg-[#B66F1A]">
                    Login
                </button>

            </form>

            <!-- Link per anar al registre -->
            <h2 class="mt-4">
                No tens compte?
                <a id="textLink" class="text-[#21201A] dark:text-[#EBE3DA] underline" href="./register.html">Registrat</a>
            </h2>

        </section>

    </main>
    <!-- Truquem al script aquí a baix perquè els botons s'han de crear primer, si posem el script a dalt no ens donarà error perquè els botons no estaran creats encara -->
    <script src="../scripts/tema.js"></script>
</body>
</html>
