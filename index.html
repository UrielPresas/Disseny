<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page | UPpop</title>
    <link href="./src/output.css" rel="stylesheet">
</head>

<body class="bg-[#C8D3D9] dark:bg-[#232526]">

    <header>
        <nav class="mx-auto flex max-w-7xl items-center px-6 py-4">

            <!-- Logo -->
            <a href="#" class="mr-8 shrink-0" aria-label="UPpop">
                <img src="./img/UPPopLogo.svg" alt="Logo" width="150" height="50">
            </a>

            <!-- Nav bar -->
            <div class="flex flex-1 items-center justify-between bg-[#F29422] px-4 py-2">

                <!-- Enlaces de navegación -->
                <ul class="hidden items-center gap-8 md:flex">
                    <li><a href="#" class="text-[#21201F] hover:text-[#c8d3d9]">Qui som</a></li>
                    <li><a href="#" class="text-[#21201F] hover:text-[#c8d3d9]">Categories</a></li>
                    <li><a href="#" class="text-[#21201F] hover:text-[#c8d3d9]">Contacte</a></li>
                </ul>

                <!-- Grupo derecho: tema + login juntos -->
                <div class="ml-auto flex items-center gap-4">

                    <!-- Botones de tema -->
                     <!-- Clar -->
                    <div class="flex items-center gap-2">
                        <button id="temaClar" type="button" class="p-1 cursor-pointer" aria-label="Tema Clar">
                            <img class="pointer-events-none" src="./img/Sol.svg" alt="Tema Clar" width="30" height="30">
                        </button>

                        <!-- Fosc -->
                        <button id="temaFosc" type="button" class="p-1 cursor-pointer" aria-label="Tema Fosc">
                            <img class="pointer-events-none" src="./img/Luna.svg" alt="Tema Fosc" width="30" height="30">
                        </button>
                    </div>

                    <a href="./html/login.html" class="rounded-lg bg-[#B66F1A] px-4 py-2 font-medium text-[#21201F] hover:bg-[#21201F] hover:text-[#f29422]">
                        Login
                    </a>
                </div>
                
            </div>
        </nav>
    </header>

    <!-- Primera sección -->
    <section class="flex min-h-screen flex-col items-center justify-center px-6 text-center">
        <h1 class="text-7xl font-bold text-[#B66F1A]">
            Benvingut a UPpop!
        </h1>

        <p class="mt-4 max-w-xl text-2xl text-[#B66F1A]">
            Els teus artistes favorits i nous sons esperant per tu
        </p>
    </section>

    <style>
        /* Registrar --x permite animarla con transition */
        @property --x {
            syntax: '<percentage>';
            inherits: true;
            initial-value: 50%;
        }

        .dividida {
            --x: 50%;
            transition: --x 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Hover: la diagonal se mueve y el bloque con el ratón crece */
        .dividida:has(.panel-izq:hover) {
            --x: 62%;
        }

        .dividida:has(.panel-der:hover) {
            --x: 38%;
        }

        /* Los dos polígonos son paralelos y dejan ~1% de hueco entre ellos */
        .panel-izq {
            clip-path: polygon(0 0, calc(var(--x) + 7.5%) 0, calc(var(--x) - 8.5%) 100%, 0 100%);
        }

        .panel-der {
            clip-path: polygon(calc(var(--x) + 8.5%) 0, 100% 0, 100% 100%, calc(var(--x) - 7.5%) 100%);
        }
    </style>

    <!-- Segunda sección -->
    <section class="flex min-h-screen items-center justify-center px-6 py-12">
        <div class="dividida relative aspect-2/1 w-full max-w-4xl">

            <!-- Panel izquierdo -->
            <div id="panell" class="panel-izq absolute inset-0 cursor-pointer rounded-2xl bg-[#F26B5F] dark:bg-[#73332D]">
                <div class="absolute inset-y-0 left-0 flex w-(--x) flex-col items-center justify-center gap-4">
                    <img src="./img/Tierra.svg" alt="Foto del planeta terra" class="h-60 w-60">
                    <h1 class="text-center text-4xl dark:text-[#EBE3DA]">Veure Mapa</h1>
                </div>
            </div>

            <!-- Panel derecho -->
            <div class="panel-der absolute inset-0 cursor-pointer rounded-2xl bg-[#F26B5F] dark:bg-[#73332D]">
                <div
                    class="absolute inset-y-0 right-0 flex w-[calc(100%-var(--x))] flex-col items-center justify-center gap-4">
                    <img src="./img/ListaUsers.svg" alt="Imatge per llistar usuaris" class="h-60 w-60">
                    <h1 class="text-center text-4xl dark:text-[#EBE3DA]">Llistar Artistes</h1>
                </div>
            </div>

        </div>
    </section>
    <!-- Truquem al script aquí a baix perquè els botons s'han de crear primer, si posem el script a dalt no ens donarà error perquè els botons no estaran creats encara -->
    <script src="./scripts/tema.js"></script>
</body>

</html>
